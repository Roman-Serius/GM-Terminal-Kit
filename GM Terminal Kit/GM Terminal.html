<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>GM Terminal Kit</title>
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Cutive+Mono&family=IBM+Plex+Mono:wght@400;500&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      body {
        margin: 0;
      }
      img {
        max-width: 100%;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <style>
      /* Layout: Finder-style GM workspace (sidebar, icon pane, toolbar) with a full-screen CRT overlay for player mode. */
      :root {
        --bg: #f5f5f7;
        --panel: #ffffff;
        --side: #ececf0;
        --line: #d6d6dc;
        --tx: #1d1d1f;
        --mut: #65656b;
        --acc: #0a7d4f;
        --accfg: #ffffff;
        --sel: #d3ebdd;
        --danger: #c0392b;
        --ic1: #d9992f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1c1e;
          --panel: #2a2a2d;
          --side: #232326;
          --line: #3a3a3f;
          --tx: #f2f2f4;
          --mut: #a0a0a7;
          --acc: #4cd694;
          --accfg: #06281b;
          --sel: #24493a;
          --danger: #ff7b6b;
          --ic1: #e8b04a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1c1e;
        --panel: #2a2a2d;
        --side: #232326;
        --line: #3a3a3f;
        --tx: #f2f2f4;
        --mut: #a0a0a7;
        --acc: #4cd694;
        --accfg: #06281b;
        --sel: #24493a;
        --danger: #ff7b6b;
        --ic1: #e8b04a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      .btn {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--tx);
        font: inherit;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--acc);
      }
      .btn.primary {
        background: var(--acc);
        color: var(--accfg);
        border-color: var(--acc);
        font-weight: 600;
      }
      .btn:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 1px;
      }
      input,
      select,
      textarea {
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--tx);
        font: inherit;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-end;
        gap: 10px 22px;
        padding: 10px 16px 12px;
        background: var(--side);
        border-bottom: 1px solid var(--line);
      }
      /* Each toolbar group has a small caption above it. */
      .tb-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .tb-label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mut);
        padding-left: 2px;
      }
      /* Row 1: name, build, play. Row 2: check, save and share, settings. */
      .tb-break {
        flex-basis: 100%;
        height: 0;
      }
      .tb-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #bar input#title {
        font-weight: 600;
        width: 200px;
        background: var(--panel);
      }
      #bar .btn,
      #bar .pill {
        height: 34px;
      }
      #bar .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      /* Joined buttons: one rounded strip with dividers. */
      .seg {
        display: flex;
      }
      .seg > .btn {
        border-radius: 0;
        margin-left: -1px;
      }
      .seg > .btn:first-child {
        border-radius: 7px 0 0 7px;
        margin-left: 0;
      }
      .seg > .btn:last-child {
        border-radius: 0 7px 7px 0;
      }
      .seg > .btn:hover,
      .seg > .btn:focus-visible {
        position: relative;
        z-index: 1;
      }
      /* A select with a swatch or caption inside one rounded box. */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 4px 0 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
      }
      .pill select {
        border: 0;
        background: transparent;
        padding: 6px 4px;
      }
      .pill-text {
        font-size: 13px;
        color: var(--mut);
      }
      .swatch {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 1px solid var(--line);
      }
      #main {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #side {
        width: 210px;
        overflow: auto;
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 8px 0;
        flex: none;
      }
      .side-node {
        padding: 5px 12px;
        cursor: default;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 6px;
        margin: 0 6px;
      }
      .side-node.active {
        background: var(--sel);
      }
      .side-node.over,
      .item.over,
      #crumb span.over {
        outline: 2px solid var(--acc);
      }
      #pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: auto;
        min-width: 0;
      }
      #crumb {
        padding: 9px 16px;
        color: var(--mut);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 2;
      }
      #crumb span {
        cursor: pointer;
        padding: 1px 4px;
        border-radius: 4px;
      }
      #crumb span:hover {
        color: var(--tx);
      }
      #grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(98px, 1fr));
        gap: 8px;
        padding: 14px 16px;
        align-content: start;
      }
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 4px;
        border-radius: 9px;
        text-align: center;
        user-select: none;
        -webkit-user-select: none;
        word-break: break-all;
        min-width: 0;
      }
      .item .item-icon {
        line-height: 0;
        color: var(--mut);
      }
      .item .item-icon svg {
        width: 46px;
        height: 46px;
      }
      .icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        flex: none;
      }
      #save-error {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
        background: color-mix(in srgb, var(--danger) 14%, var(--panel));
        border-bottom: 1px solid var(--danger);
        line-height: 1.45;
      }
      #save-error span {
        flex: 1 1 320px;
      }
      input[type="color"] {
        height: 44px;
        padding: 4px;
        cursor: pointer;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 4px;
      }
      input[type="color"]::-moz-color-swatch {
        border: 0;
        border-radius: 4px;
      }
      .hex {
        color: var(--mut);
        font-weight: 400;
      }
      .color-preview {
        margin: 2px 0 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        font:
          20px/1.15 "VT323",
          "Courier New",
          monospace;
        white-space: pre;
        overflow-x: auto;
      }
      .badges svg {
        width: 13px;
        height: 13px;
        vertical-align: -2px;
      }
      .item.selected {
        background: var(--sel);
      }
      .item.is-hidden {
        opacity: 0.5;
      }
      .item.is-destroyed .item-icon {
        opacity: 0.35;
      }
      .item.is-destroyed > div:nth-child(2) {
        text-decoration: line-through;
        color: var(--mut);
      }
      .tag {
        display: inline-block;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        line-height: 1.35;
      }
      .tag.destroyed {
        color: var(--danger);
        border-color: var(--danger);
      }
      .field-label {
        margin: 10px 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .event-card textarea {
        width: 100%;
      }
      .after-list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-bottom: 8px;
      }
      .after-list .check {
        margin: 0;
        font-weight: 400;
      }
      .timer-row span {
        flex: none;
        font-size: 13px;
        color: var(--mut);
      }
      .timer-row input {
        flex: 0 0 90px;
      }
      .card.warn {
        border-color: var(--danger);
      }
      .card.warn ul {
        margin: 4px 0 10px;
      }
      .tag.event {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      .tag.event.fired {
        color: var(--acc);
        border-color: var(--acc);
      }
      .badges {
        font-size: 11px;
        color: var(--mut);
        min-height: 14px;
      }
      .empty {
        grid-column: 1/-1;
        color: var(--mut);
        padding: 40px 10px;
        text-align: center;
        line-height: 1.7;
      }
      .context-menu {
        position: fixed;
        z-index: 100;
        min-width: 190px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 4px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
      }
      .context-menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 6px 10px;
        border: 0;
        background: none;
        color: var(--tx);
        font: inherit;
        border-radius: 5px;
        cursor: pointer;
      }
      .context-menu button:hover {
        background: var(--sel);
      }
      .context-menu .danger {
        color: var(--danger);
      }
      .context-menu hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 0;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        color: var(--tx);
        padding: 0;
        width: min(680px, calc(100vw - 32px));
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      dialog header {
        padding: 14px 16px;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }
      dialog footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
      }
      .dialog-body {
        padding: 16px;
        max-height: 65vh;
        overflow: auto;
      }
      .dialog-body label {
        display: block;
        margin: 0 0 10px;
        font-weight: 500;
        font-size: 13px;
      }
      .dialog-body label input:not([type="checkbox"]),
      .dialog-body label select,
      .dialog-body textarea,
      .dialog-body > input,
      .dialog-body > select {
        display: block;
        width: 100%;
        margin-top: 4px;
      }
      .dialog-body textarea {
        margin-bottom: 8px;
      }
      .check {
        display: flex !important;
        gap: 8px;
        align-items: center;
      }
      .check input {
        width: auto !important;
        margin: 0 !important;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .row > * {
        min-width: 0;
      }
      .row > input,
      .row > label {
        flex: 1;
      }
      .row > .btn {
        flex: none;
      }
      .mono {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
      }
      .hint {
        color: var(--mut);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .mail {
        margin: 6px 0 8px 12px;
      }
      .field-row {
        align-items: center;
        justify-content: space-between;
        margin: 10px 0 4px;
      }
      .field-row .field-label {
        margin: 0;
      }
      .map-dialog {
        width: min(1200px, calc(100vw - 32px));
      }
      .map-dialog .dialog-body {
        max-height: 75vh;
      }
      .event-map {
        position: relative;
        display: flex;
        gap: 90px;
        align-items: flex-start;
        overflow-x: auto;
        padding: 4px 60px 20px 4px;
      }
      .map-lines {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
      }
      .map-lines path {
        fill: none;
        stroke: var(--mut);
        stroke-width: 1.5;
      }
      .map-lines path.dashed {
        stroke-dasharray: 5 4;
      }
      .map-lines marker path {
        fill: var(--mut);
        stroke: none;
      }
      .map-lines text {
        font-size: 11px;
        fill: var(--tx);
        paint-order: stroke;
        stroke: var(--panel);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .map-column {
        flex: 0 0 220px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .map-title {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--mut);
      }
      .map-box {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        font-size: 13px;
        color: var(--tx);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
      }
      .map-box:hover {
        border-color: var(--acc);
      }
      .map-box.ending {
        border: 2px solid var(--tx);
      }
      .unreached .map-box {
        border-style: dashed;
        opacity: 0.75;
      }
      .map-box ul {
        margin: 4px 0 0;
        padding-left: 16px;
        color: var(--mut);
        font-size: 12px;
      }
      .map-box li.never {
        color: var(--danger);
      }
      .map-key {
        float: right;
        font-size: 11px;
        color: var(--mut);
      }
      .map-tag {
        display: inline-block;
        margin: 6px 4px 0 0;
        padding: 0 6px;
        border-radius: 4px;
        font-size: 11px;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .map-tag.ending {
        background: var(--tx);
        color: var(--panel);
        border-color: var(--tx);
      }
      .flash-card {
        animation: flash-card 1.6s ease-out;
      }
      @keyframes flash-card {
        0%,
        40% {
          border-color: var(--acc);
          box-shadow: 0 0 0 3px var(--sel);
        }
      }
      .gif-preview {
        margin: 0;
        padding: 8px;
        overflow-x: auto;
        font-size: 9px;
        line-height: 1;
        background: #050805;
        color: #33ff66;
        border-radius: 8px;
      }
      code {
        background: var(--bg);
        padding: 1px 5px;
        border-radius: 4px;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        text-align: center;
        background: #050805;
        color: #33ff66;
        font-family: "VT323", "Courier New", monospace;
        text-shadow: 0 0 8px rgba(51, 255, 102, 0.5);
        cursor: pointer;
        transition: opacity 0.5s;
      }
      #splash::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0 1px, transparent 1px 3px);
        box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.7);
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash p {
        margin: 0;
      }
      .splash-title {
        font-size: clamp(40px, 9vw, 84px);
        line-height: 1;
        animation: splash-in 0.6s ease-out both;
      }
      .splash-by {
        margin-top: 10px !important;
        font-size: clamp(20px, 3.5vw, 30px);
        color: color-mix(in srgb, #33ff66 60%, #050805);
        animation: splash-in 0.6s 0.4s ease-out both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-title,
        .splash-by {
          animation: none;
        }
      }
      @media (max-width: 700px) {
        #side {
          display: none;
        }
        #bar {
          justify-content: flex-start;
        }
        .tb-label[aria-hidden="true"] {
          display: none;
        }
        .tb-title,
        #bar input#title {
          width: 100%;
        }
      }

      #player {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 50;
        overflow-y: auto;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 18px
          calc(40px + env(safe-area-inset-bottom, 0px));
        background: var(--pbg);
        color: var(--pfg);
        font: var(--psize) / 1.15 var(--pfont);
        --pdim: color-mix(in srgb, var(--pfg) 55%, var(--pbg));
        /* Set per screen type below. */
        --glow: 0 0 6px color-mix(in srgb, var(--pfg) 50%, transparent);
        --scan: rgba(0, 0, 0, 0.2);
        --vignette: inset 0 0 110px rgba(0, 0, 0, 0.65);
        text-shadow: var(--glow);
      }
      #player[data-screen="soft"] {
        --glow: 0 0 2px color-mix(in srgb, var(--pfg) 35%, transparent);
        --scan: rgba(0, 0, 0, 0.12);
        --vignette: inset 0 0 60px rgba(0, 0, 0, 0.4);
      }
      #player[data-screen="flat"] {
        --glow: none;
        --scan: transparent;
        --vignette: none;
        line-height: 1.35;
      }
      #player[data-screen="neon"] {
        --glow:
          -1px 0 color-mix(in srgb, var(--paccent) 70%, transparent),
          1px 0 color-mix(in srgb, var(--pfg) 60%, transparent),
          0 0 9px color-mix(in srgb, var(--pfg) 55%, transparent);
        --scan: rgba(0, 0, 0, 0.16);
        line-height: 1.25;
      }
      /* Teletype: ink on a paper roll with tractor-feed holes down both edges. */
      #player[data-screen="paper"] {
        --glow:
          0.4px 0 0 var(--pfg),
          0 0 1px color-mix(in srgb, var(--pfg) 45%, transparent);
        --scan: transparent;
        --vignette: inset 0 0 70px rgba(80, 60, 20, 0.18);
        line-height: 1.3;
        padding-left: 46px;
        padding-right: 46px;
        background:
          radial-gradient(circle, rgba(0, 0, 0, 0.22) 4px, transparent 5px) left 9px top 6px / 18px
            24px repeat-y,
          radial-gradient(circle, rgba(0, 0, 0, 0.22) 4px, transparent 5px) right 9px top 6px / 18px
            24px repeat-y,
          linear-gradient(90deg, transparent 34px, rgba(0, 0, 0, 0.12) 34px 35px, transparent 35px)
            left top / 100% 100% repeat-y,
          linear-gradient(270deg, transparent 34px, rgba(0, 0, 0, 0.12) 34px 35px, transparent 35px)
            left top / 100% 100% repeat-y,
          var(--pbg);
        background-attachment: local;
      }
      /* 80s home computer: a wide colored border around the screen. */
      #player.bordered {
        border: clamp(14px, 4vw, 36px) solid var(--pborder);
      }
      #player.upper,
      #player.upper #command-input {
        text-transform: uppercase;
      }
      #player::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          var(--scan) 0,
          var(--scan) 1px,
          transparent 1px,
          transparent 3px
        );
        box-shadow: var(--vignette);
      }
      /* Curved glass: rounded dark corners on the CRT looks. */
      #player[data-screen="crt"]::before,
      #player[data-screen="neon"]::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        border-radius: 28px / 36px;
        box-shadow: 0 0 0 40px #000;
      }
      #player pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: inherit;
      }
      /* A blank line in a script still takes up a line. */
      #out pre:empty::before {
        content: "\00a0";
      }
      /* @slow and @speak text: a slightly brighter "voice" for characters talking to the player. */
      #player .voice {
        color: color-mix(in srgb, var(--pfg) 55%, #ffffff);
      }

    <script>
      // The kit's own markup, captured before anything renders. "Export for players" builds the
      // player file from it.
      const KIT_SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;
      const $ = (selector) => document.querySelector(selector),
        esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (ch) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[ch],
          );
      // The script instructions, as listed in the program editor and the Commands window.
      const SCRIPT_DIRECTIVES = [
        "@wait 800",
        "@progress Label",
        "@clear",
        "@slow Text",
        "@speak Text",
        "@sound alarm",
        "@flash",
        "@shake",
        "@glitch",
        "@theme Red alert",
        "@play PATH\\FILE.GIF",
        "@notify Message to the GM",
        "@ask Question?",
        "@if YES",
        "@else",
        "@endif",
        "@reveal PATH\\FILE",
        "@delete PATH\\FILE",
        "@trigger Event name",
        "@countdown 60 Event name | LABEL",
        "@stop",
        "@end",
      ]
        .map((directive) => `<code>${directive}</code>`)
        .join(" ");
      const makeId = () => Math.random().toString(36).slice(2, 9),
        sleep = (ms) => new Promise((done) => setTimeout(done, ms));
      const STORAGE_KEY = "gmterminalkit.v1";
      // A theme is a whole look: colors, screen font, cursor and how much CRT glow and curve the
      // screen has. The keys are saved in scenarios, so existing ones keep their names.
      //   screen: crt (glow, scanlines, curved glass), soft (a little of each), flat (an LCD),
      //           paper (printed on a teletype roll), neon (crt plus color fringing)
      //   cursor: block, under (blinking underscore) or bar (the browser's thin caret)
      const THEMES = {
        green: { name: "80s green CRT", fg: "#33ff66", bg: "#050805", font: "vt", screen: "crt", cursor: "block" },
        amber: { name: "Amber terminal", fg: "#ffb000", bg: "#0a0600", font: "vt", screen: "crt", cursor: "block" },
        dos: { name: "DOS PC", fg: "#c0c0c0", bg: "#000000", font: "vt", screen: "soft", cursor: "under" },
        blue: { name: "PC blue", fg: "#d6dcff", bg: "#0000a8", font: "vt", screen: "soft", cursor: "under" },
        home: {
          name: "80s home computer",
          fg: "#a59ef7",
          bg: "#40318d",
          border: "#7869c4",
          font: "vt",
          screen: "soft",
          cursor: "block",
          upper: true,
        },
        teletype: {
          name: "Military teletype",
          fg: "#23211c",
          bg: "#efe8d2",
          accent: "#a3201a",
          font: "typewriter",
          screen: "paper",
          cursor: "under",
          upper: true,
        },
        corporate: {
          name: "90s corporate",
          fg: "#14233a",
          bg: "#d3dae3",
          accent: "#1d4f91",
          font: "plex",
          screen: "flat",
          cursor: "bar",
        },
        cyberpunk: {
          name: "Cyberpunk",
          fg: "#00f0ff",
          bg: "#0d0221",
          accent: "#ff2a6d",
          font: "tech",
          screen: "neon",
          cursor: "block",
        },
        white: { name: "Paper white", fg: "#dfe6df", bg: "#080908", font: "vt", screen: "crt", cursor: "block" },
        cyan: { name: "Ice cyan", fg: "#4de3ff", bg: "#02090b", font: "vt", screen: "crt", cursor: "block" },
        magenta: { name: "Neon magenta", fg: "#ff4fd8", bg: "#0b020a", font: "vt", screen: "crt", cursor: "block" },
        red: { name: "Red alert", fg: "#ff5a3c", bg: "#0b0302", font: "vt", screen: "crt", cursor: "block" },
      };
      // Screen fonts come from Google Fonts; offline, each falls back to a font already on the computer.
      const FONTS = {
        vt: { family: '"VT323", "Courier New", monospace', size: "20px" },
        typewriter: { family: '"Cutive Mono", "Courier New", monospace', size: "19px" },
        plex: { family: '"IBM Plex Mono", Menlo, Consolas, monospace', size: "16px" },
        tech: { family: '"Share Tech Mono", Menlo, Consolas, monospace', size: "18px" },
      };
      // "Custom colors" keeps the green CRT look with the GM's own colors.
      const themeLook = (key) =>
        THEMES[key] || { ...THEMES.green, fg: state.meta.fg, bg: state.meta.bg };
      // Property names in the scenario (meta, nodes, users, pw, burn, ...) are saved to localStorage and
      // exported files. Renaming them would break existing saves, so they stay as-is.
      const blankScenario = () => ({
        meta: {
          title: "UNTITLED TERMINAL",
          date: "10-14-1987",
          theme: "green",
          fg: "#33ff66",
          bg: "#050805",
          boot: "MEMORY CHECK ... 640K OK\nLOADING SYSTEM ...",
          org: "",
          gmPass: "",
          skipBoot: false,
          notifyUrl: "", // Discord webhook for @notify; left out of Export, put into player files
        },
        events: [],
        nodes: {},
        users: [
          {
            name: "GUEST",
            pw: "",
            mail: [],
          },
        ],
        cmds: [],
        log: [],
      });
      // Events: { id, name, announce, also, fired }. Files and mail have `event` ("" = always there);
      // they appear once that event has fired. `also` is the id of another event fired at the same time.
      // Older scenarios used numbered rounds instead: convert them to events "Round 1", "Round 2", ...
      // where each round also fires the one before it, so they behave exactly as before.
      function migrateRounds(scenario) {
        scenario.events = scenario.events || [];
        const items = [
          ...Object.values(scenario.nodes || {}),
          ...(scenario.users || []).flatMap((user) => user.mail || []),
        ];
        const lastRound = Math.max(0, ...items.map((item) => +item.round || 0));
        const roundIds = [];
        for (let round = 1; round <= lastRound; round++) {
          const event = {
            id: makeId(),
            name: "Round " + round,
            announce: "",
            also: roundIds[round - 2] || "",
            fired: round <= (+scenario.round || 0),
          };
          scenario.events.push(event);
          roundIds.push(event.id);
        }
        items.forEach((item) => {
          if (+item.round > 0) item.event = roundIds[item.round - 1];
          item.event = item.event || "";
          delete item.round;
        });
        delete scenario.round;
        // Mail messages need ids so an event can fire when one is read.
        (scenario.users || []).forEach((user) =>
          (user.mail || []).forEach((mail) => (mail.id = mail.id || makeId())),
        );
        return scenario;
      }
      // A player file (made with "Export for players") carries its scenario in #player-bundle and
      // never touches the GM's saved scenario.
      const bundleEl = document.getElementById("player-bundle");
      const PLAYER_FILE = bundleEl ? unscramble(bundleEl.textContent) : null;
      let state;
      if (PLAYER_FILE) state = { ...PLAYER_FILE.scenario, log: [] };
      else
        try {
          state = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!state || !state.nodes) state = blankScenario();
          migrateRounds(state);
        } catch {
          state = blankScenario();
        }
      const CONDITION_TYPES = {
        login: "Logs in as",
        type: "Types",
        read: "Reads file",
        run: "Runs program",
        mail: "Reads mail",
        unlock: "Unlocks",
        enter: "Enters folder",
      };
      const getEvent = (id) => state.events.find((event) => event.id === id),
        // An item with no event, or whose event was deleted, is always there.
        hasFired = (id) => !id || !getEvent(id) || getEvent(id).fired,
        // True if a program or command script contains "@trigger <event name>".
        scriptTriggers = (script, event) =>
          (script || "").split("\n").some((line) => {
            const match =
              line.match(/^@trigger\s+(.*)$/i) ||
              line.match(/^@countdown\s+\d+\s+([^|]+?)\s*(?:\|.*)?$/i);
            return !!match && match[1].trim().toUpperCase() === event.name.trim().toUpperCase();
          }),
        eventOptions = (selectedId) =>
          state.events
            .map(
              (event) =>
                `<option value="${event.id}" ${event.id === selectedId ? "selected" : ""}>${esc(event.name)}</option>`,
            )
            .join("");
      let saveTimer;
      const save = () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          if (PLAYER_FILE) return saveProgress();
          let saved = true;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch {
            saved = false;
          }
          // The scenario in memory is still complete, so Export keeps working after a failed save.
          $("#save-error").hidden = saved;
        }, 300);
      };

      /* ---------- file saving (viewer confirms each save) ---------- */
      let downloads = null;
      try {
        Promise.resolve(window.claude && window.claude.use ? window.claude.use("downloads") : null)
          .then((api) => {
            downloads = api || null;
          })
          .catch(() => {});
      } catch {}
      const inArtifact = () => !!(window.claude && window.claude.use),
        canSave = () => !!downloads || !inArtifact();
      function browserDownload(text, filename) {
        try {
          const url = URL.createObjectURL(
              new Blob([text], {
                type: "text/plain",
              }),
            ),
            link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch {
          showTextDialog("Copy this text to a file on your computer", text, filename, true);
        }
      }

      /* ---------- file tree helpers ---------- */
      const getNode = (id) => state.nodes[id];
      const childrenOf = (parentId) =>
        Object.values(state.nodes)
          .filter((node) => node.parent === parentId)
          .sort(
            (a, b) =>
              (a.kind === "dir" ? 0 : 1) - (b.kind === "dir" ? 0 : 1) ||
              a.name.localeCompare(b.name),
          );
      const pathParts = (id) => {
        const parts = [];
        while (id) {
          parts.unshift(getNode(id).name);
          id = getNode(id).parent;
        }
        return parts;
      };
      const fullPath = (id) => "C:\\" + pathParts(id).join("\\");
      const isDescendant = (id, ancestorId) => {
        while (id) {
          if (id === ancestorId) return true;
          id = getNode(id).parent;
        }
        return false;
      };
      function uniqueName(parentId, name, excludeId) {
        const ext = (name.match(/\.[^.]*$/) || [""])[0],
          stem = ext ? name.slice(0, -ext.length) : name;
        let counter = 2,
          candidate = name;
        while (
          childrenOf(parentId).some(
            (sibling) =>
              sibling.id !== excludeId && sibling.name.toLowerCase() === candidate.toLowerCase(),
          )
        )
          candidate = stem + " " + counter++ + ext;
        return candidate;
      }
      function createNode(parentId, name, kind, content = "", extra = {}) {
        const id = makeId();
        state.nodes[id] = {
          id,
          name: uniqueName(parentId, name),
          kind,
          parent: parentId,
          content,
          pw: "",
          user: "",
          hidden: false,
          event: "",
          burn: false,
          destroyed: false,
          revealed: false,
          ...extra,
        };
        return id;
      }
      function cloneNode(id, parentId, name) {
        const source = getNode(id),
          copyId = createNode(parentId, name || source.name, source.kind, source.content, {
            pw: source.pw,
            user: source.user,
            hidden: source.hidden,
            event: source.event,
            burn: source.burn,
            ...(source.frames && { frames: source.frames, delays: source.delays }),
          });
        childrenOf(id).forEach((child) => cloneNode(child.id, copyId));
        return copyId;
      }
      function deleteNode(id) {
        childrenOf(id).forEach((child) => deleteNode(child.id));
        delete state.nodes[id];
      }
      function moveNode(id, to) {
        to = to === "root" ? null : to;
        const node = getNode(id);
        if (!node || id === to || (to && isDescendant(to, id)) || node.parent === to) return;
        node.parent = to;
        node.name = uniqueName(to, node.name, id);
        save();
        render();
      }

      /* ---------- dialogs ---------- */
      function openDialog(
        title,
        body,
        buttons = [
          {
            label: "Close",
          },
        ],
      ) {
        const dialog = document.createElement("dialog");
        dialog.innerHTML = `<header>${esc(title)}</header><div class="dialog-body">${body}</div><footer></footer>`;
        const footer = dialog.querySelector("footer");
        buttons.forEach((spec) => {
          const button = document.createElement("button");
          button.className = "btn" + (spec.primary ? " primary" : "");
          button.textContent = spec.label;
          button.onclick = () => {
            if (!spec.onClick || spec.onClick(dialog) !== false) dialog.close();
          };
          footer.append(button);
          if (spec.primary) dialog.primaryButton = button;
        });
        dialog.addEventListener("close", () => dialog.remove());
        dialog.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.tagName === "INPUT" && dialog.primaryButton) {
            e.preventDefault();
            dialog.primaryButton.click();
          }
        });
        document.body.append(dialog);
        dialog.showModal();
        return dialog;
      }
      const promptText = (title, initial = "") =>
        new Promise((done) => {
          const dialog = openDialog(title, `<input id="ask-value" value="${esc(initial)}">`, [
            {
              label: "Cancel",
              onClick: () => done(null),
            },
            {
              label: "OK",
              primary: true,
              onClick: (dialogEl) => done(dialogEl.querySelector("#ask-value").value),
            },
          ]);
          dialog.querySelector("#ask-value").select();
        });
      const confirmAction = (message) =>
        new Promise((done) =>
          openDialog("Confirm", `<p>${esc(message)}</p>`, [
            {
              label: "Cancel",
              onClick: () => done(false),
            },
            {
              label: "Continue",
              primary: true,
              onClick: () => done(true),
            },
          ]),
        );
      function copyDialogText(dialog) {
        const textarea = dialog.querySelector("textarea"),
          selectAll = () => {
            textarea.focus();
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);
          };
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(textarea.value).catch(selectAll);
        else selectAll();
        return false;
      }
      function showTextDialog(title, text, filename, noSave) {
        const buttons = [
          {
            label: "Close",
          },
          {
            label: "Copy",
            onClick: copyDialogText,
          },
        ];
        if (canSave() && !noSave)
          buttons.push({
            label: "Save file…",
            primary: true,
            onClick: () => {
              saveFile(text, filename);
              return false;
            },
          });
        else buttons[1].primary = true;
        openDialog(
          title,
          `<textarea class="mono" rows="18" readonly style="width:100%">${esc(text)}</textarea>`,
          buttons,
        );
      }
      async function saveFile(text, filename) {
        if (!downloads) {
          if (!inArtifact()) return browserDownload(text, filename);
          return showTextDialog("Copy this text to a file on your computer", text, filename, true);
        }
        try {
          await downloads.save({
            filename: filename,
            data: text,
          });
        } catch (err) {
          if (err && err.code === "declined") return;
          showTextDialog("Saving was not available. Copy the text instead", text, filename, true);
        }
      }

      /* ---------- GM view ---------- */
      let currentFolderId = null,
        selectedId = null;
      const ICON_PATHS = {
        dir: '<path d="M5 14a3 3 0 0 1 3-3h10l5 5h17a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" style="fill:var(--ic1);stroke:var(--ic1)"/><path d="M5 22h38" style="stroke:var(--panel);opacity:.55"/>',
        txt: '<path d="M13 6h16l9 9v26a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" style="fill:var(--panel)"/><path d="M29 6v9h9"/><path d="M17 25h14M17 31h14M17 37h8"/>',
        img: '<rect x="6" y="9" width="36" height="30" rx="3" style="fill:var(--panel)"/><circle cx="17" cy="19" r="3" style="stroke:var(--acc)"/><path d="M6 35l11-10 8 7 6-5 11 9" style="stroke:var(--acc)"/>',

      const shrinkImage = (file) =>

            img = new Image();
          img.onload = () => {
            const scale = Math.min(1, 800 / img.width),
              canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

      // Choices for a condition's target menu: accounts, files, programs, mail and so on.
      function conditionChoices(type) {
        const nodes = Object.values(state.nodes),
          paths = (filter) =>
            nodes
              .filter(filter)
              .map((node) => ({ value: node.id, label: fullPath(node.id) }))
              .sort((a, b) => a.label.localeCompare(b.label));
        if (type === "login")
          return state.users.map((user) => ({ value: user.name, label: user.name }));
        if (type === "read") return paths((node) => node.kind === "txt" || node.kind === "img");
        if (type === "run") return paths((node) => node.kind === "exe");
        if (type === "unlock") return paths((node) => node.pw);
        if (type === "enter") return paths((node) => node.kind === "dir");
        if (type === "mail")
          return state.users.flatMap((user) =>
            user.mail.map((mail) => ({
              value: mail.id,
              label: `to ${user.name}: ${mail.subj || "(no subject)"}`,
            })),

        return [];
      }
      function describeCondition(condition) {
        if (condition.type === "type") return `types "${condition.target}"`;
        const choice = conditionChoices(condition.type).find(

      // Event map analysis, shared by the text outline and the drawn map. Step 1 events can fire

      function analyzeEvents() {
        const nodes = Object.values(state.nodes),
          mails = state.users.flatMap((user) => user.mail.map((mail) => ({ ...mail, to: user.name }))),
          steps = new Map(), // event id -> step it can first fire at
          reached = (id) => !id || !getEvent(id) || steps.has(id),
          // Paths a reached event's script reveals with @reveal.
          revealedBy = (events) =>
            new Set(
              events.flatMap((event) =>
                (event.announce || "")
                  .split("\n")
                  .map((line) => line.match(/^@reveal\s+(.*)$/i))
                  .filter(Boolean)
                  .map((match) => findByPath(match[1].trim())?.id),

            );

          for (let node = getNode(id); node; node = getNode(node.parent))
            if (!reached(node.event) && !revealed.has(node.id)) return false;
          return true;
        };

        const ways = (event, revealed) => [
          ...(event.when || []).map((condition) => ({
            text: describeCondition(condition),
            ok:

              (condition.type === "login" || condition.type === "type"
                ? true
                : condition.type === "mail"
                  ? reached(mails.find((mail) => mail.id === condition.target)?.event)
                  : !!getNode(condition.target) && nodeAvailable(condition.target, revealed)),
          })),
          ...nodes
            .filter((node) => node.kind === "exe" && scriptTriggers(node.content, event))
            .map((node) => ({
              text: "running " + fullPath(node.id),
              ok: nodeAvailable(node.id, revealed),
            })),
          ...state.cmds
            .filter((cmd) => scriptTriggers(cmd.text, event))
            .map((cmd) => ({ text: "typing the command " + cmd.name.toUpperCase(), ok: true })),
          ...state.events
            .filter((other) => other !== event && scriptTriggers(other.announce, event))
            .map((other) => ({ text: `the script of "${other.name}"`, ok: steps.has(other.id) })),
          ...state.events
            .filter((other) => other.also === event.id)
            .map((other) => ({ text: `"${other.name}" (also fires)`, ok: steps.has(other.id) })),

            ? [{ text: `${event.afterMinutes} minute(s) of play`, ok: true }]

              depth++;
            } else if (kind === "else") out.push(`${indent + "  ".repeat(Math.max(0, depth - 1))}otherwise:`);

                ask: `asks "${arg}"`,
                trigger: `fires "${arg}"`,
                countdown: `starts a countdown: ${arg}`,
                stop: "stops the countdown",
                end: "ENDS THE GAME",
                reveal: `reveals ${arg}`,
                delete: `deletes ${arg}`,
                theme: `switches the theme to ${arg || "the default"}`,
                play: `plays ${arg}`,

              if (countdown && equalsIgnoreCase(countdown[2].trim(), event.name.trim()))

            });
            if (other.also === event.id) add(other.id, event.id, "also fires");
          });

            // Ways that come from other events are drawn as arrows, so the box lists the rest.
            allWays = analysis.ways(event),
            ways = allWays
              .filter((way) => !/^the script of|\(also fires\)$/.test(way.text))
              .map((way) => `<li${way.ok ? "" : ' class="never"'}>${esc(way.text)}${way.ok ? "" : " (never available)"}</li>`)
              .join(""),
            tags = [
              files && `+${files} file${files > 1 ? "s" : ""}`,
              mail && `+${mail} mail`,
              /\bASKS\b/i.test(outline) && "asks",
              /starts a countdown/.test(outline) && "countdown",
              /^@sound\b/im.test(event.announce || "") && "sound",
              /ENDS THE GAME/.test(outline) && "ends the game",
            ]
              .filter(Boolean)
              .map((tag) => `<span class="map-tag${tag === "ends the game" ? " ending" : ""}">${tag}</span>`)
              .join("");
          return `<button class="map-box${/ENDS THE GAME/.test(outline) ? " ending" : ""}" data-map-event="${event.id}" title="Open in the Events window"><b>${esc(event.name)}</b>${index < 9 ? `<span class="map-key">Ctrl+Shift+${index + 1}</span>` : ""}${ways ? `<ul>${ways}</ul>` : allWays.length ? "" : '<ul><li class="never">nothing fires it but the GM</li></ul>'}${tags ? `<div>${tags}</div>` : ""}</button>`;
        };
        const dialog = openDialog(
          "Event map",
          state.events.length
            ? `<p class="hint">Steps follow the order things can happen when players play with no GM. Arrows show what leads to what; a dashed arrow means “only after”. Click an event to edit it.</p><div class="event-map"><svg class="map-lines" aria-hidden="true"><defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"></path></marker></defs></svg>${columns
                .map(
                  (column) =>
                    `<div class="map-column${column.unreached ? " unreached" : ""}"><p class="map-title">${esc(column.title)}</p>${column.events.map(box).join("")}</div>`,
                )
                .join("")}</div>`
            : "<p>No events yet. Add some in the Events window.</p>",
          [
            {
              label: "Text version",
              onClick: () => {
                showTextDialog("Event map", eventMapText(), "event-map.txt");
                return false;
              },
            },
            { label: "Close", primary: true },
          ],
        );
        dialog.classList.add("map-dialog");
        dialog.addEventListener("click", (e) => {
          const target = e.target.closest("[data-map-event]");
          if (!target) return;
          document.querySelectorAll("dialog[open]").forEach((open) => open.close());
          openEvents(target.dataset.mapEvent);
        });
        const map = dialog.querySelector(".event-map");
        if (!map) return;
        // Arrows are drawn once the boxes have their final positions.
        requestAnimationFrame(() => {
          const svg = map.querySelector("svg"),
            place = (id) => {
              const el = map.querySelector(`[data-map-event="${id}"]`);
              return { left: el.offsetLeft, top: el.offsetTop, right: el.offsetLeft + el.offsetWidth, mid: el.offsetTop + el.offsetHeight / 2, column: el.parentElement };
            },
            columnOf = (el) => [...map.querySelectorAll(".map-column")].indexOf(el);
          svg.setAttribute("width", map.scrollWidth);
          svg.setAttribute("height", map.scrollHeight);
          svg.innerHTML += edges
            .map((edge) => {
              const a = place(edge.from),
                b = place(edge.to),
                forward = columnOf(b.column) > columnOf(a.column);
              // Forward: right side to left side. Same column or backward: loop round the right.
              const [x1, y1, x2, y2] = forward ? [a.right, a.mid, b.left, b.mid] : [a.right, a.mid, b.right, b.mid],
                bend = forward ? Math.max(30, (x2 - x1) / 2) : 46,
                [c1, c2] = forward ? [x1 + bend, x2 - bend] : [x1 + bend, x2 + bend],
                labelX = (x1 + 3 * c1 + 3 * c2 + x2) / 8,
                labelY = (y1 + 3 * y1 + 3 * y2 + y2) / 8;
              return `<path class="${edge.dashed ? "dashed" : ""}" d="M${x1} ${y1}C${c1} ${y1} ${c2} ${y2} ${x2} ${y2}" marker-end="url(#map-arrow)"></path><text x="${forward ? labelX : labelX + 6}" y="${labelY - 4}" text-anchor="${forward ? "middle" : "start"}">${esc(edge.labels.join(", "))}</text>`;
            })
            .join("");
        });
      }
      // Event map as text: the scenario as an outline, in the order things can happen with no GM.
      function eventMapText() {
        const { nodes, mails, steps, ways, releases, scriptOutline } = analyzeEvents();
        const describe = (event) => {
          const index = state.events.indexOf(event),
            lines = [`  ${event.name}${index < 9 ? `  [Ctrl+Shift+${index + 1}]` : ""}`],
            allWays = ways(event),
            after = (event.after || []).map((id) => getEvent(id)?.name).filter(Boolean),
            items = releases(event),
            outline = scriptOutline(event.announce, "      ");
          lines.push(
            allWays.length
              ? `    Fires from: ${allWays.map((way) => way.text + (way.ok ? "" : " (never available)")).join("; or ")}`
              : "    Fires from: nothing (only the GM can fire it)",
          );
          if (after.length) lines.push(`    Only after: ${after.join(", ")}`);
          if (items.length) lines.push(`    Releases: ${items.join(", ")}`);
          if (outline.length) lines.push("    Script:", ...outline);
          return lines;
        };
        const lines = [`EVENT MAP - ${state.meta.title}`, "In the order things can happen when players play with no GM.", ""];
        lines.push("AT THE START");
        const atStart = (id) => {
            for (let node = getNode(id); node; node = getNode(node.parent))
              if (node.event && getEvent(node.event)) return false;
            return true;
          },
          startFiles = nodes.filter((node) => node.kind !== "dir" && atStart(node.id));
        lines.push(`  Accounts: ${state.users.map((user) => user.name + (user.pw ? " (password)" : "")).join(", ")}`);
        const programs = startFiles.filter((node) => node.kind === "exe");
        if (programs.length) lines.push(`  Programs: ${programs.map((node) => fullPath(node.id)).join(", ")}`);
        if (state.cmds.length) lines.push(`  Commands: ${state.cmds.map((cmd) => cmd.name.toUpperCase()).join(", ")}`);
        lines.push(`  ${startFiles.length} file(s) and ${mails.filter((mail) => !getEvent(mail.event)).length} mail are there from the start.`);
        const lastStep = Math.max(0, ...steps.values());
        for (let step = 1; step <= lastStep; step++) {
          lines.push("", `STEP ${step}`);
          state.events.filter((event) => steps.get(event.id) === step).forEach((event) => lines.push(...describe(event)));
        }
        const endings = state.events.filter((event) => scriptOutline(event.announce, "").includes("ENDS THE GAME"));
        lines.push("", "ENDINGS");
        if (!endings.length) lines.push("  No event script uses @end, so the game never ends by itself.");
        endings.forEach((event) =>
          lines.push(`  ${event.name}: ${steps.has(event.id) ? "reachable at step " + steps.get(event.id) : "NOT REACHABLE without a GM"}`),
        );
        const unreached = state.events.filter((event) => !steps.has(event.id));
        if (unreached.length) {
          lines.push("", "NEVER FIRES WITHOUT A GM (fire these with the hotkey, or tick Fired)");
          unreached.forEach((event) => lines.push(...describe(event)));
        }
        return lines.join("\n");
      }

="btn" id="set-about">About</button></div>`,

        const updatePreview = () => {

          if (!isWebhook(url))

00\n@sound boot\n@wait 700\n[S3] ERROR: A low, buzzy error tone.\n@wait 1200\n@sound error\n@wait 700\n[S4] ALERT: Two quick two-tone chirps.\n@wait 1200\n@sound alert\n@wait 700\n[S5] CHIRP: One fast upward chirp.\n@wait 1200\n@sound chirp\n@wait 700\n[S6] TICK: A single tiny tick (listen closely).\n@wait 1200\n@sound tick\n@wait 700\n[S7] KEYS: A burst of keyboard clicks.\n@wait 1200\n@sound keys\n@wait 700\n[S8] SUCCESS: Four rising notes.\n@wait 1200\n@sound success\n@wait 700\n[S9] FAIL: Three falling notes.\n@wait 1200\n@sound fail\n@wait 700\n[S10] ALARM: A siren rising and falling three times (about 2 seconds).\n@wait 1200\n@sound alarm\n@wait 700\n[S11] KLAXON: Three low, harsh pulses (about 2 seconds).\n@wait 1200\n@sound klaxon\n@wait 700\n[S12] STATIC: A burst of radio static.\n@wait 1200\n@sound static\n@wait 700\n[S13] GLITCH: Digital crackle.\n@wait 1200\n@sound glitch\n@wait 700\n[S14] POWERUP: A tone sweeping upward (1 second).\n@wait 1200\n@sound powerup\n@wait 700\n[S15] POWERDOWN: A tone sweeping down to a low growl (1 second).\n@wait 1200\n@sound powerdown\n@wait 700\n[S16] DIALTONE: A phone dial tone (1.5 seconds).\n@wait 1200\n@sound dialtone\n@wait 700\n[S17] RING: A phone ringing twice.\n@wait 1200\n@sound ring\n@wait 700\n[S18] BUSY: A busy signal: three beeps (2.5 seconds).\n@wait 1200\n@sound busy\n@wait 700\n[S19] DIAL 5550714: Seven touch-tone digits being dialed.\n@wait 1200\n@sound dial 5550714\n@wait 700\n[S20] MODEM: A dial-up modem connecting (about 3 seconds).\n@wait 1200\n@sound modem\n@wait 700\n[S21] MISSPELLED SOUND: nothing should play. (With Run now, a [TEST] note appears instead.)\n@wait 1200\n@sound alarmm\n@wait 700\n\nSound test finished. If you heard nothing at all, check your volume and type SOUND ON."},{"name":"VOICE","listed":true,"text":"VOICE TEST.\n\n[V1] A robotic voice reads this line aloud while it types out.\n@wait 1200\n@speak Hello. I am the terminal. Can you hear me?\n@wait 300\n[V2] A longer line. The script waits for the voice to finish before going on.\n@wait 1200\n@speak This sentence is a little longer, so you can judge whether the voice is clear enough for players to follow.\n@wait 300\n[V3] For comparison: the same kind of line with @slow, typed out with no voice.\n@wait 1200\n@slow This one is silent. Same color, no voice.\n@wait 300\n\nVoice test finished. Type SOUND OFF and run VOICE again: the text should still type out, silently. Then type SOUND ON."},{"name":"EFFECTS","listed":true,"text":"SCREEN EFFECTS TEST.\nThese lines are here so the glitch has something to scramble.\nThe quick brown fox jumps over the lazy dog.\n\n[E1] FLASH: the screen flashes white once.\n@wait 1200\n@flash\n@wait 700\n[E2] FLASH RED: the screen flashes red once.\n@wait 1200\n@flash red\n@wait 700\n[E3] SHAKE: the text shakes for half a second.\n@wait 1200\n@shake\n@wait 700\n[E4] LONG SHAKE: the text shakes for 2 seconds.\n@wait 1200\n@shake 2000\n@wait 700\n[E5] GLITCH: the screen jitters and the last lines scramble for under a second, then go back to normal.\n@wait 1200\n@glitch\n@wait 700\n[E6] LONG GLITCH: the same for 3 seconds. Every line should come back exactly as it was.\n@wait 1200\n@glitch 3000\n@wait 700\n[E7] EVERYTHING AT ONCE: alarm, red flash, shake and glitch, like a real emergency.\n@wait 1200\n@sound alarm\n@flash red\n@shake 800\n@sound static\n@glitch 1200\n@wait 700\n\nEffects test finished."},{"name":"THEMES","listed":true,"text":"THEME TEST. Each theme shows a sample: a normal line, a character speaking, and an error. Press Enter to move to the next one.\n\n[T1] 80S GREEN CRT: Glowing green, curved corners, scanlines, block cursor.\n@theme 80s green CRT\nNormal text: The quick brown fox jumps over the lazy dog. 0123456789\n@slow This is how a character speaking looks.\n@ask (Press Enter to continue)\n[T2] AMBER TERMINAL: The same monitor in amber.\n@theme Amber terminal\nNormal text: The quick brown fox jumps over the lazy dog. 0123456789\n@slow This is ho       function loadSample() {
        const defaults = blankScenario(),
          sample = JSON.parse(JSON.stringify(SAMPLE_SCENARIO));
        state = migrateRounds({ ...defaults, ...sample, meta: { ...defaults.meta, ...sample.meta } });
        currentFolderId = selectedId = null;
        save();
        render();
      }
      /* sample-end */
      $("#btn-accounts").onclick = openAccounts;
      $("#btn-commands").onclick = openCommands;
      $("#btn-events").onclick = openEvents;
      $("#btn-activity").onclick = openActivityLog;
      $("#btn-settings").onclick = openSettings;
      $("#btn-answer-key").onclick = () =>
        showTextDialog("Answer key", answerKeyText(), "answer-key.txt");
      const exportScenario = () =>
        saveFile(
          JSON.stringify(
            {
              ...state,
              meta: { ...state.meta, notifyUrl: "" },
              log: [],
            },
            null,
            1,
          ),
          (state.meta.title || "scenario").replace(/\W+/g, "-").toLowerCase() + ".json",
        );
      $("#btn-export").onclick = exportScenario;
      $("#save-error-export").onclick = exportScenario;
      $("#btn-import").onclick = () => $("#scenario-import").click();
      $("#scenario-import").onchange = async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (!data.nodes || !data.users) throw 0;
          if (!(await confirmAction("Replace the current scenario with this file?"))) return;
          const defaults = blankScenario();
          state = {
            ...defaults,
            ...data,
            meta: {
              ...defaults.meta,
              ...data.meta,
            },
            log: [],
          };
          migrateRounds(state);
          currentFolderId = selectedId = null;
          save();
          render();
        } catch {
          openDialog("Import failed", "<p>That file is not a scenario export from this tool.</p>");
        }
      };

      /* ---------- player mode ---------- */
      const session = {
        user: "GUEST",
        cwd: null,
        unlocked: new Set(),
        history: [],
        historyIndex: 0,
        pendingSecret: null,
        busy: false,
        playedMs: 0, // play time, for events that fire by themselves
        unlocks: [], // player file: passwords entered, in order, so progress can be restored
        pendingChanges: [], // player file: @reveal/@delete aimed inside a still-locked folder
        countdown: null, // running @countdown: { eventId, label, endsAt, total }
        ended: false, // set by @end; afterwards only RESTART (or GMMODE for the GM) works
        theme: "", // set by @theme; "" = the scenario's own theme
        testing: false, // "Run now" from the Events or Commands window
      };
      const playerEl = $("#player"),
        outputEl = $("#out"),
        inputEl = $("#command-input"),
        promptEl = $("#prompt");
      const printLine = (text = "", className = "") => {
        const line = document.createElement("pre");
        if (className) line.className = className;
        line.textContent = text;
        outputEl.append(line);
        playerEl.scrollTop = playerEl.scrollHeight;
        return line;
      };
      const promptPath = () =>
          (
            "C:\\" + (session.cwd && getNode(session.cwd) ? pathParts(session.cwd).join("\\") : "")
          ).toUpperCase(),
        setPrompt = (text) => (promptEl.textContent = text);
      // Log entries keep short keys (t = time, u = user, x = action) for compatibility with saved data.
      const logActivity = (action) => {
        state.log.push({
          t: new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          }),
          u: session.user,
          x: action,
        });
        if (state.log.length > 400) state.log.shift();
        save();
      };
      // destroyed / revealed are set during play (self-destruct, @delete, @reveal) and cleared by
      // Reset session, so the GM's own event and hidden settings are never overwritten.
      const isReleased = (node) => !node.destroyed && (hasFired(node.event) || !!node.revealed),
        isHiddenNow = (node) => node.hidden && !node.revealed,
        isGone = (id) => {
          if (!getNode(id)) return true;
          for (let node = getNode(id); node; node = getNode(node.parent))
            if (node.destroyed) return true;
          return false;
        },
        equalsIgnoreCase = (a, b) => String(a).toUpperCase() === String(b).toUpperCase(),
        padName = (name) => name.toUpperCase().padEnd(16);
      function applyTheme() {
        const theme = themeLook(session.theme || state.meta.theme);
        playerEl.style.setProperty("--pfg", theme.fg);
        playerEl.style.setProperty("--pbg", theme.bg);
        playerEl.style.setProperty("--paccent", theme.accent || theme.fg);

      const isWebhook = (url) => /^https:\/\/(\w+\.)?discord(app)?\.com\/api\/webhooks\//.test(url || "");
      async function postToDiscord(url, content) {
        const form = new FormData();
        // Multipart keeps this a "simple" request, so Discord accepts it from any page, even a
        // file opened from disk. No pings: messages never mention @everyone or anyone else.
        form.append(
          "payload_json",
          JSON.stringify({
            content: content.slice(0, 1900),
            username: (state.meta.title || "GM Terminal Kit").slice(0, 80),
            allowed_mentions: { parse: [] },
          }),
        );

          await fetch(url, { method: "POST", body: form, mode: "no-cors" });

      let notifyQueue = [],
        flushingNotify = false;
      function notifyGM(message) {
        if (!isWebhook(state.meta.notifyUrl)) return;

        flushNotify();

      async function flushNotify() {
        if (flushingNotify || !notifyQueue.length || !isWebhook(state.meta.notifyUrl)) return;

            const item = notifyQueue[0],
              late = Date.now() - item.at > 60000,
              text = late
                ? `${item.text} (sent late, happened ${new Date(item.at).toLocaleString([], { dateStyle: "short", timeStyle: "short" })})`
                : item.text;

            notifyQueue.shift();
            await sleep(1200); // stay well under Discord's rate limit

          flushingNotify = false;

      addEventListener("online", flushNotify);
      const answerMatches = (answer, accepted) =>
        accepted.split(",").some((option) => normalizePhrase(option) === normalizePhrase(answer));
      async function runScript(text) {
        if (session.ended) return;
        session.busy = true;
        // @ask / @if / @else / @endif: `skipping` is true inside a branch that doesn't apply. Each
        // open @if remembers whether it matched and whether the lines around it were skipped.
        let answer = "",
          skipping = false;
        const branches = [];
        try {
          const lines = (text || "").split("\n");
          // Sounds and screen effects on consecutive lines start together (a siren while the
          // screen shakes); the script then waits for the longest of them.
          let together = [];
          for (const [index, line] of lines.entries()) {
            if (session.ended) break;
            if (line[0] === "@") {
              const [directive, ...rest] = line.slice(1).split(" "),
                arg = rest.join(" ").trim(),
                kind = directive.toLowerCase();
              if (kind === "if") {
                const matched = !skipping && answerMatches(answer, arg);
                branches.push({ matched, outerSkipping: skipping });
                skipping = skipping || !matched;
                continue;
              }
              if (kind === "else") {
                const branch = branches.at(-1);
                if (branch) skipping = branch.outerSkipping || branch.matched;
                continue;
              }
              if (kind === "endif") {
                const branch = branches.pop();
                if (branch) skipping = branch.outerSkipping;
                continue;
              }
              if (skipping) continue;
              if (kind === "ask") {
                // A timed event can start while a player is typing a password; let them finish.

              } else if (/^(sound|flash|shake|glitch)$/.test(kind)) {

                  kind === "sound"
                    ? playSound(arg)
                    : kind === "flash"
                      ? flashScreen(arg)
                      : kind === "shake"

                session.theme = themeKey(arg);

                    countdown: "would start a countdown: " + arg,
                    stop: "would stop the countdown",
                    end: "the game would end here",
                    reveal: "would reveal " + arg,
                    delete: "would delete " + arg,

                    "#".repeat(step) +

                    "] " +
                    step * 5 +

      // Fires an event plus its "also fires" chain. Announcements print only while the terminal is
      // open. Returns false if the event had already fired.
      function fireEvent(event, source) {
        const chain = [];
        for (
          let next = event;
          next && !next.fired && !chain.includes(next);
          next = getEvent(next.also)

          chain.push(next);
        chain.forEach((item) => {
          item.fired = true;
          logActivity(`EVENT ${item.name} (${source})`);

        if (playerEl.style.display === "block")
          chain.forEach((item) => item.announce && queueScript("\n" + item.announce));

      const findEventByName = (name) =>
          state.events.find((event) => equalsIgnoreCase(event.name.trim(), String(name).trim())),

      function playerAction(type, target) {
        let matched = false;
        state.events.forEach((event) => {
          if (event.fired || !requirementsMet(event)) return;
          const hit = (event.when || []).some(
            (condition) =>
              condition.type === type &&
              (type === "login" || type === "type"
                ? normalizePhrase(condition.target) === normalizePhrase(target)
                : condition.target === target),
          );
          if (hit) {
            matched = true;
            fireEvent(event, CONDITION_TYPES[type].toLowerCase());

        return matched;

      // ---- countdowns and endings
      function drawCountdown(suffix = "") {
        const countdown = session.countdown,
          bar = $("#countdown");

        const done = Math.max(
            0,
            Math.min(1, 1 - (countdown.endsAt - Date.now()) / countdown.total),

          filled = Math.floor(done * 20);

      async function runProgram(node) {

      const COMMANDS = {

            " Volume in drive C is " +

      async function runCommand(input) {

        // never answered with "Bad command". Built-in commands and programs still run.
        const phraseMatched = playerAction("type", input);
        const parts = input.match(/^(\S+)\s*(.*)$/),

          args = parts[2].trim(),

        if (COMMANDS[name]) return COMMANDS[name](args);
        const resolved = resolvePath(parts[1]),
          node = resolved && resolved.chain.at(-1);

              PLAYER_FILE
