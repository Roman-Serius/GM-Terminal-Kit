        inputEl.focus();
        logActivity("SESSION START");
      }
      // "Run now": plays one script in the terminal, then returns to the window it came from.
      // Nothing in the game changes (see testNote), and timers and countdowns are paused.
      async function testScript(title, script, reopen) {
        document.querySelectorAll("dialog[open]").forEach((dialog) => dialog.close());
        const wasEnded = session.ended,
          wasTheme = session.theme;
        session.ended = false;
        session.testing = true;
        session.theme = "";
        applyTheme();
        $("#countdown").hidden = true;
        outputEl.innerHTML = "";
        playerEl.style.display = "block";
        document.body.style.overflow = "hidden";
        setPrompt("");
        inputEl.disabled = false;
        inputEl.focus();
        printLine("TEST RUN: " + title, "dim");
        printLine("");
        await queueScript(script);
        printLine("");
        await askLine("End of test. Press Enter to return.");
        setPrompt("");
        session.testing = false;
        session.ended = wasEnded;
        session.theme = wasTheme;
        // Wait for Enter to come back up, or it would press a button in the reopened window.
        await new Promise((done) => {
          window.addEventListener("keyup", done, { once: true });
          setTimeout(done, 1000);
        });
        exitPlayer();
        reopen();
      }
      function exitPlayer() {
        if (window.speechSynthesis) speechSynthesis.cancel();
        playerEl.style.display = "none";
        document.body.style.overflow = "";
        render();
      }
      function openResetSession() {
        const nodes = Object.values(state.nodes),
          destroyed = nodes.filter((node) => node.destroyed),
          revealed = nodes.filter((node) => node.revealed),
          firedEvents = state.events.filter((event) => event.fired),
          list = (items) =>
            items.map((node) => `<li class="mono">${esc(fullPath(node.id))}</li>`).join("");
        const summary =
          destroyed.length || revealed.length
            ? (destroyed.length
                ? `<p>Restore ${destroyed.length} destroyed file(s):</p><ul>${list(destroyed)}</ul>`
                : "") +
              (revealed.length
                ? `<p>Undo ${revealed.length} program reveal(s):</p><ul>${list(revealed)}</ul>`
                : "")
            : "<p>No files were destroyed or revealed during play.</p>";
        openDialog(
          "Reset player session",
          `${summary}<label class="check"><input id="reset-events" type="checkbox" ${firedEvents.length ? "checked" : "disabled"}> Turn off fired events${firedEvents.length ? ": " + firedEvents.map((event) => esc(event.name)).join(", ") : " (none fired)"}</label><label class="check"><input id="reset-log" type="checkbox"> Clear the activity log</label><p class="hint">Your files, accounts, mail and commands are not changed. Use this between groups or before replaying a scenario.</p>`,
          [
            { label: "Cancel" },
            {
              label: "Reset",
              primary: true,
              onClick: (dialog) => {
                nodes.forEach((node) => {
                  node.destroyed = false;
                  node.revealed = false;
                });
                if (dialog.querySelector("#reset-events").checked)
                  state.events.forEach((event) => (event.fired = false));
                if (dialog.querySelector("#reset-log").checked) state.log = [];
                save();
                render();
              },
            },
          ],
        );
      }
      /* ---------- player files ---------- */
      // "Export for players" saves a copy of this page that opens straight into the terminal. The
      // scenario travels inside it, protected in two layers:
      //   - Anything behind a file or folder password is encrypted with that password (AES-GCM, key
      //     from PBKDF2), so it can't be read from the file without solving the puzzle.
      //   - Everything else is scrambled so it isn't readable at a glance. Account passwords are
      //     stored only as salted hashes.
      function isLocked(node) {
        return !!(node.pw || node.locked);
      }
      function toBase64(bytes) {
        let text = "";
        for (let i = 0; i < bytes.length; i += 0x8000)
          text += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        return btoa(text);
      }
      function fromBase64(text) {
        return Uint8Array.from(atob(text), (ch) => ch.charCodeAt(0));
      }
      // Scrambling is a simple XOR stream: it stops casual reading, not a determined player.
      function keystream(seed, length) {
        const out = new Uint8Array(length);
        let x = seed >>> 0 || 1;
        for (let i = 0; i < length; i++) {
          x ^= x << 13;
          x >>>= 0;
          x ^= x >>> 17;
          x ^= x << 5;
          x >>>= 0;
          out[i] = x & 255;
        }
        return out;
      }
      function scramble(object) {
        const seed = crypto.getRandomValues(new Uint32Array(1))[0] || 1,
          bytes = new TextEncoder().encode(JSON.stringify(object)),
          key = keystream(seed, bytes.length);
        bytes.forEach((byte, i) => (bytes[i] = byte ^ key[i]));
        return JSON.stringify({ seed, data: toBase64(bytes) });
      }
      // Runs before the rest of the script is set up, so it only uses function declarations.
      function unscramble(text) {
        const { seed, data } = JSON.parse(text),
          bytes = fromBase64(data),
          key = keystream(seed, bytes.length);
        bytes.forEach((byte, i) => (bytes[i] = byte ^ key[i]));
        return JSON.parse(new TextDecoder().decode(bytes));
      }
      // Passwords ignore capitals everywhere in the kit, so keys and hashes use the uppercase form.
      async function deriveKey(password, salt) {
        const material = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(String(password).toUpperCase()),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"],
        );
      }
      async function seal(object, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16)),
          iv = crypto.getRandomValues(new Uint8Array(12)),
          key = await deriveKey(password, salt),
          data = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv },
            key,
            new TextEncoder().encode(JSON.stringify(object)),
          );
        return { salt: toBase64(salt), iv: toBase64(iv), data: toBase64(new Uint8Array(data)) };
      }
      async function openSealed(sealed, password) {
        try {
          const key = await deriveKey(password, fromBase64(sealed.salt)),
            plain = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: fromBase64(sealed.iv) },
              key,
              fromBase64(sealed.data),
            );
          return JSON.parse(new TextDecoder().decode(plain));
        } catch {
          return null; // wrong password: AES-GCM rejects the data
        }
      }
      async function hashPassword(password, salt) {
        const digest = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(salt + ":" + String(password).toUpperCase()),
        );
        return toBase64(new Uint8Array(digest));
      }
      // Decrypts a locked file or folder with the player's guess and adds what was inside it.
      async function unseal(node, password) {
        const secret = await openSealed(node.sealed, password);
        if (!secret) return false;
        node.content = secret.content;
        if (secret.frames) Object.assign(node, { frames: secret.frames, delays: secret.delays });
        secret.nodes.forEach((inner) => (state.nodes[inner.id] = inner));
        delete node.sealed;
        session.unlocks.push({ id: node.id, pw: password });
        session.pendingChanges = session.pendingChanges.filter(
          (change) => !applyPathChange(change.kind, change.path),
        );
        return true;
      }

      // Player progress lives in the player's own browser, one entry per exported file.
      let restoringProgress = false;
      const progressKey = () => "gmterminalkit.player." + PLAYER_FILE.id;
      function saveProgress() {
        if (restoringProgress || session.ended) return;
        const nodes = Object.values(state.nodes);
        try {
          localStorage.setItem(
            progressKey(),
            JSON.stringify({
              user: session.user,
              cwd: session.cwd,
              theme: session.theme,
              playedMs: session.playedMs,
              unlocks: session.unlocks,
              pendingChanges: session.pendingChanges,
              notifyQueue,
              fired: state.events.filter((event) => event.fired).map((event) => event.id),
              destroyed: nodes.filter((node) => node.destroyed).map((node) => node.id),
              revealed: nodes.filter((node) => node.revealed).map((node) => node.id),
              countdown: session.countdown && {
                eventId: session.countdown.eventId,
                label: session.countdown.label,
                left: Math.max(0, session.countdown.endsAt - Date.now()),
                total: session.countdown.total,
              },
            }),
          );
        } catch {}
      }
      function clearProgress() {
        try {
          localStorage.removeItem(progressKey());
        } catch {}
      }
      async function restoreProgress() {
        let progress = null;
        try {
          progress = JSON.parse(localStorage.getItem(progressKey()));
        } catch {}
        if (!progress) return false;
        restoringProgress = true;
        try {
          session.pendingChanges = progress.pendingChanges || [];
          notifyQueue = progress.notifyQueue || [];
          // Unlock in the original order: a folder inside a locked folder needs its parent first.
          for (const { id, pw } of progress.unlocks || []) {
            const node = getNode(id);
            if (node && node.sealed && (await unseal(node, pw))) session.unlocked.add(id);
          }
          (progress.fired || []).forEach((id) => getEvent(id) && (getEvent(id).fired = true));
          (progress.destroyed || []).forEach((id) => getNode(id) && (getNode(id).destroyed = true));
          (progress.revealed || []).forEach((id) => getNode(id) && (getNode(id).revealed = true));
          session.user = progress.user || session.user;
          session.cwd = progress.cwd && !isGone(progress.cwd) ? progress.cwd : null;
          session.playedMs = progress.playedMs || 0;
          session.theme = progress.theme || "";
          // A countdown resumes where it was, so reloading can't dodge a finale.
          const countdown = progress.countdown,
            countdownEvent = countdown && getEvent(countdown.eventId);
          if (countdownEvent && !countdownEvent.fired)
            session.countdown = {
              eventId: countdown.eventId,
              label: countdown.label,
              endsAt: Date.now() + countdown.left,
              total: countdown.total,
            };
        } finally {
          restoringProgress = false;
        }
        saveProgress();
        return true;
      }

      // Copies the scenario into the form a player file carries: a fresh start (nothing fired,
      // destroyed or revealed), no GM passphrase, and locked content sealed with its password.
      async function buildPlayerBundle(startUser) {
        const meta = state.meta,
          scenario = {
            meta: {
              title: meta.title,
              date: meta.date,
              theme: meta.theme,
              fg: meta.fg,
              bg: meta.bg,
              boot: meta.boot,
              org: meta.org,
              skipBoot: meta.skipBoot,
              notifyUrl: meta.notifyUrl,
            },
            events: state.events.map((event) => ({
              id: event.id,
              name: event.name,
              announce: event.announce,
              also: event.also,
              afterMinutes: event.afterMinutes || 0,
              when: (event.when || []).map((condition) => ({ ...condition })),
              after: [...(event.after || [])],
              fired: false,
            })),
            users: [],
            cmds: state.cmds.map((cmd) => ({ name: cmd.name, listed: cmd.listed, text: cmd.text })),
            nodes: {},
          };
        for (const user of state.users) {
          const salt = makeId() + makeId();
          scenario.users.push({
            name: user.name,
            salt,
            pwHash: user.pw ? await hashPassword(user.pw, salt) : "",
            mail: user.mail.map((mail) => ({
              id: mail.id,
              from: mail.from,
              subj: mail.subj,
              body: mail.body,
              event: mail.event,
            })),
          });
        }
        // Returns the records for a node and everything under it. Under a password, the content
        // and all descendants go into one sealed package that only the right password opens.
        const pack = async (node) => {
          const record = {
            id: node.id,
            name: node.name,
            kind: node.kind,
            parent: node.parent,
            content: node.content,
            user: node.user,
            hidden: node.hidden,
            event: node.event,
            burn: node.burn,
            destroyed: false,
            revealed: false,
            ...(node.frames && { frames: node.frames, delays: node.delays }),
          };
          const inside = [];
          for (const child of childrenOf(node.id)) inside.push(...(await pack(child)));
          if (!node.pw) return [record, ...inside];
          const sealed = await seal(
            { content: node.content, frames: node.frames, delays: node.delays, nodes: inside },
            node.pw,
          );
          return [{ ...record, content: "", frames: undefined, delays: undefined, locked: true, sealed }];
        };
        for (const node of childrenOf(null))
          (await pack(node)).forEach((record) => (scenario.nodes[record.id] = record));
        return { id: makeId() + makeId(), startUser, scenario };
      }

      // Problems that only matter without a GM: events nobody can fire, and passwords with no clue.
      // True if a webhook is set and some script uses @notify.
      const scriptsUsingNotify = () =>
          [
            ...Object.values(state.nodes)
              .filter((node) => node.kind === "exe")
              .map((node) => node.content),
            ...state.cmds.map((cmd) => cmd.text),
            ...state.events.map((event) => event.announce),
          ].filter((script) => /^@notify\b/im.test(script || "")).length,
        usesNotify = () => isWebhook(state.meta.notifyUrl) && scriptsUsingNotify() > 0;
      function playerExportWarnings() {
        const programScripts = [
          ...Object.values(state.nodes)
            .filter((node) => node.kind === "exe")
            .map((node) => node.content),
          ...state.cmds.map((cmd) => cmd.text),
        ];
        // An event can fire without a GM if a player action, a timer or a program/command can
        // fire it, or a reachable event fires it (its script, or "Also fires"), once everything it
        // must come after can fire too.
        const reachable = new Set();
        const canStart = (event) =>
          event.afterMinutes > 0 ||
          (event.when || []).some((condition) => condition.target) ||
          programScripts.some((script) => scriptTriggers(script, event)) ||
          state.events.some(
            (other) =>
              reachable.has(other.id) &&
              (other.also === event.id || scriptTriggers(other.announce, event)),
          );
        for (let grew = true; grew; ) {
          grew = false;
          state.events.forEach((event) => {
            if (
              !reachable.has(event.id) &&
              canStart(event) &&
              (event.after || []).every((id) => reachable.has(id) || !getEvent(id))
            ) {
              reachable.add(event.id);
              grew = true;
            }
          });
        }
        const unreachable = state.events
          .filter((event) => !reachable.has(event.id))
          .map((event) => ({
            event,
            items: [
              ...Object.values(state.nodes)
                .filter((node) => node.event === event.id)
                .map((node) => fullPath(node.id)),
              ...state.users.flatMap((user) =>
                user.mail
                  .filter((mail) => mail.event === event.id)
                  .map((mail) => `mail to ${user.name}: ${mail.subj}`),
              ),
            ],
          }));
        const lower = (text) => String(text || "").toLowerCase(),
          texts = (excludeId) => [
            ...Object.values(state.nodes)
              .filter((node) => node.kind !== "dir" && node.kind !== "img" && node.id !== excludeId)
              .map((node) => node.content),
            ...state.users.flatMap((user) => user.mail.map((mail) => mail.body)),
            ...state.cmds.map((cmd) => cmd.text),
          ],
          hasClue = (password, excludeId) =>
            texts(excludeId).some((text) => lower(text).includes(lower(password)));
        const noClue = [
          ...state.users
            .filter((user) => user.pw && !hasClue(user.pw, null))
            .map((user) => `Account ${user.name}`),
          ...Object.values(state.nodes)
            .filter((node) => node.pw && !hasClue(node.pw, node.id))
            .map((node) => fullPath(node.id)),
        ];
        return { unreachable, noClue };
      }
      function openPlayerExport() {
        if (!window.crypto?.subtle)
          return openDialog(
            "Export for players",
            "<p>This browser can’t encrypt here. Open the kit straight from your computer (not from a website without https://) and try again.</p>",
          );
        const { unreachable, noClue } = playerExportWarnings(),
          list = (items) =>
            `<ul>${items.map((item) => `<li class="mono">${esc(item)}</li>`).join("")}</ul>`,
          users = state.users
            .map(
              (user) =>
                `<option ${user.name === $("#start-user").value ? "selected" : ""}>${esc(user.name)}</option>`,
            )
            .join("");
        const warnings =
          (unreachable.length
            ? `<div class="card warn"><p><b>Events nothing can fire.</b> Without a GM, an event only fires from a program or command (<code>@trigger</code>), from a timer in the Events window, or from another event’s “Also fires”. Players will never see what these unlock:</p>${unreachable
                .map(
                  ({ event, items }) =>
                    `<p class="mono">${esc(event.name)}</p>${items.length ? list(items) : '<p class="hint">Nothing attached.</p>'}`,
                )
                .join("")}</div>`
            : "") +
          (noClue.length
            ? `<div class="card warn"><p><b>Passwords with no clue in the scenario.</b> Players can only get these if you send them separately:</p>${list(noClue)}</div>`
            : "") +
          (scriptsUsingNotify() && !isWebhook(state.meta.notifyUrl)
            ? '<div class="card warn"><p><b><code>@notify</code> has nowhere to go.</b> Scripts use it, but no Discord webhook link is set in Settings, so nothing will be sent.</p></div>'
            : "") +
          (usesNotify()
            ? '<p class="hint">This file will send <code>@notify</code> messages to your Discord channel, and tells players so when it starts. Anyone who digs through the file could find the link; if it is ever misused, delete the webhook in Discord and make a new one.</p>'
            : "");
        openDialog(
          "Export for players",
          `<p>Saves a separate file to send to players. It opens straight into the terminal, has no GM workspace, and remembers each player’s progress in their own browser.</p><label>Players start as<select id="player-start">${users}</select></label>${warnings || '<p class="hint">No problems found.</p>'}<p class="hint">Files and folders with a password are encrypted with that password. Hidden files, files waiting for an event, and mail are only scrambled, so someone who can read code could still dig them out.</p><p class="hint">The file starts fresh: events fired, files destroyed and reveals from your own test runs are not included. The GM passphrase and the activity log are left out.</p>`,
          [
            { label: "Cancel" },
            {
              label: unreachable.length || noClue.length ? "Export anyway" : "Save player file",
              primary: true,
              onClick: (dialog) => {
                const startUser = dialog.querySelector("#player-start").value;
                buildPlayerBundle(startUser).then((bundle) => {
                  // The sample's text and answers live in the kit's code; cut them out of player files.
                  const sampleBegin = "/* sample-" + "begin */",
                    sampleEnd = "/* sample-" + "end */",
                    cutFrom = KIT_SOURCE.indexOf(sampleBegin),
                    cutTo = KIT_SOURCE.indexOf(sampleEnd, cutFrom);
                  const source =
                    cutFrom >= 0 && cutTo > cutFrom
                      ? KIT_SOURCE.slice(0, cutFrom) +
                        "function loadSample() {}" +
                        KIT_SOURCE.slice(cutTo + sampleEnd.length)
                      : KIT_SOURCE;
                  const html = source
                    .replace(
                      /<title>[^<]*<\/title>/,
                      `<title>${esc(state.meta.title || "Terminal")}</title>`,
                    )
                    .replace(
                      "<script>",
                      `<script type="application/json" id="player-bundle">${scramble(bundle)}<\/script>\n    <script>`,
                    );
                  saveFile(
                    html,
                    (state.meta.title || "terminal").replace(/\W+/g, "-").toLowerCase() +
                      "-player.html",
                  );
                });
              },
            },
          ],
        );
      }

      let lastCountdownSave = 0;
      setInterval(() => {
        const countdown = session.countdown;
        if (!countdown || session.ended || session.testing || playerEl.style.display !== "block")
          return;
        drawCountdown();
        // Saved directly (not through the debounced save(), which this 4x-a-second tick would keep
        // postponing), so a reload resumes the countdown instead of escaping it.
        if (PLAYER_FILE && Date.now() - lastCountdownSave > 1000) {
          lastCountdownSave = Date.now();
          saveProgress();
        }
        if (Date.now() < countdown.endsAt) return;
        session.countdown = null;
        printLine($("#countdown").textContent);
        drawCountdown();
        const event = getEvent(countdown.eventId);
        if (event && !event.fired) fireEvent(event, "countdown");
      }, 250);
      // Events can fire by themselves after some minutes of play. Play time only counts while the
      // terminal is open; in a player file it carries over between visits.
      setInterval(() => {
        if (playerEl.style.display !== "block" || inputEl.disabled || session.testing) return;
        session.playedMs += 1000;
        state.events.forEach((event) => {
          if (
            !event.fired &&
            event.afterMinutes > 0 &&
            session.playedMs >= event.afterMinutes * 60000 &&
            requirementsMet(event)
          )
            fireEvent(event, "timer");
        });
        if (PLAYER_FILE && session.playedMs % 15000 === 0) save();
      }, 1000);
      $("#btn-play").onclick = launchPlayer;
      $("#btn-reset").onclick = openResetSession;
      $("#btn-player-export").onclick = openPlayerExport;
      if (PLAYER_FILE) {
        document.title = state.meta.title || "Terminal";
        $("#bar").hidden = $("#main").hidden = true;
        launchPlayer();
      } else {
        render();
        showSplash();
      }
      // Title card shown when the kit opens. It is built here, after KIT_SOURCE was captured,
      // and never in a player file, so exports don't include it. A click or key skips it.
      function showSplash() {
        const splash = document.createElement("div");
        splash.id = "splash";
        splash.innerHTML = "<div><p class=\"splash-title\">GM Terminal Kit</p><p class=\"splash-by\">by RomanSerius</p></div>";
        document.body.append(splash);
        const close = () => {
          splash.classList.add("gone");
          setTimeout(() => splash.remove(), 500);
          removeEventListener("keydown", close, true);
        };
        splash.addEventListener("click", close);
        addEventListener("keydown", close, true);
        setTimeout(close, 2200);
      }
    </script>
  </body>
</html>
